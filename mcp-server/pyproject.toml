[project]
name = "ops-mcp"
version = "0.1.0"
description = "Ops-tools MCP server for the incident copilot demo (service catalog, metrics, logs, deploys) with fault injection."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.12,<2",
    "uvicorn>=0.30",
    "starlette>=0.37",
]

[project.scripts]
ops-mcp = "ops_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_mcp"]
